<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="84" viewBox="0 0 400 84" fill="none" role="img"><title>LinkedIn — Shrish Verma</title><style>@font-face{font-family:'AG Mono mono-b';src:url(data:font/woff;base64,) format('woff');font-display:block}
@keyframes agFade{from{opacity:0}to{opacity:1}}
@keyframes agRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes agSlideR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes agSlideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes agDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

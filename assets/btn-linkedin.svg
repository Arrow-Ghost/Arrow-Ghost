@keyframes agBreathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes agBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes agScan{from{transform:translateY(-30%)}to{transform:translateY(130%)}}
.fi{animation:agFade 1.2s ease both}
.r{animation:agRise 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
.sr{animation:agSlideR 1s cubic-bezier(.2,.8,.2,1) both}
.sl{animation:agSlideL 1s cubic-bezier(.2,.8,.2,1) both}
.draw{stroke-dasharray:1;animation:agDraw 1.6s cubic-bezier(.6,.05,.25,1) both}
.wipe{animation:agWipe 1.1s cubic-bezier(.7,0,.2,1) both}
.breathe{animation:agBreathe 3.6s ease-in-out infinite}
.blink{animation:agBlink 1.1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

@keyframes bDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes bComet{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes bHead{from{stroke-dashoffset:82}to{stroke-dashoffset:-18}}
@keyframes bSheen{0%{transform:translateX(-160px) skewX(-24deg)}28%,100%{transform:translateX(520px) skewX(-24deg)}}
@keyframes bSpin{to{transform:rotate(360deg)}}
@keyframes bNudge{0%,60%,100%{transform:translate(0,0)}75%{transform:translate(2px,-2px)}}
.bB{stroke-dasharray:1;animation:bDraw 1.3s cubic-bezier(.6,.05,.25,1) both}
.bC{stroke-dasharray:24 76;animation:bComet 4.8s linear infinite}
.bH{stroke-dasharray:5 95;animation:bHead 4.8s linear infinite}

name: telemetry

# Redraws assets/telemetry.svg + assets/langs.svg from live GitHub data.
# Deliberately no `push` trigger: this job commits to main and would re-run on its own commit.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fonttools

      - name: Draw telemetry
        env:
          # Add a GH_TOKEN repo secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          FILES="assets/telemetry.svg assets/langs.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "telemetry: refresh"
          git push
